name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test
      
      - name: Generate coverage report
        working-directory: ./frontend
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
  
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
  
  # Lint Check
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install ESLint (frontend)
        working-directory: ./frontend
        run: |
          if [ -f package.json ] && grep -q "eslint" package.json; then
            npm ci
            npm run lint || echo "No lint script found"
          else
            echo "ESLint not configured yet"
          fi
      
      - name: Install ESLint (backend)
        working-directory: ./backend
        run: |
          if [ -f package.json ] && grep -q "eslint" package.json; then
            npm ci
            npm run lint || echo "No lint script found"
          else
            echo "ESLint not configured yet"
          fi
  
  # Build Verification
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build version file
        working-directory: ./frontend
        run: npm run build
      
      - name: Verify build artifacts
        working-directory: ./frontend
        run: |
          if [ ! -f js/config.js ]; then
            echo "Build failed: config.js not found"
            exit 1
          fi
          echo "Build successful"
  
  # Deploy to Railway (only on main branch after all tests pass)
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, lint, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy Backend
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying backend to Railway..."
          # Railway will auto-deploy based on railway.json configuration
          echo "Backend deployment triggered"
      
      - name: Deploy Frontend
        working-directory: ./frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying frontend to Railway..."
          # Railway will auto-deploy based on railway.json configuration
          echo "Frontend deployment triggered"
      
      - name: Deployment Status
        run: |
          echo "✅ All tests passed"
          echo "✅ Deployment to Railway completed"
          echo "🚀 Application is live at https://speed-test.up.railway.app/"
