<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>404 - Page Not Found | SpeedCheck</title>
    
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/css/vars.css?v=1.69.1">
    <link rel="stylesheet" href="/css/base.css?v=1.69.1">
    <link rel="stylesheet" href="/css/404.css?v=1.69.1">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page-404">
    
    <button class="theme-toggle-inline" id="themeToggle" aria-label="Toggle theme">
        <i data-lucide="moon" class="theme-icon"></i>
    </button>

    <div class="error-container">
        <i data-lucide="ghost" class="error-icon"></i>
        
        <div class="error-code">404</div>
        
        <h1>Page Not Found</h1>
        
        <p>
            Looks like your request got lost in the tubes. Even with the fastest internet, we can't find this page.
        </p>
        
        <div class="nav-buttons">
            <a href="/" class="btn-primary">
                <i data-lucide="home"></i>
                Go Home
            </a>
            <a href="/learn.html" class="btn-secondary">
                <i data-lucide="book-open"></i>
                Learn Basics
            </a>
        </div>
    </div>

    <script>
        // Minimal theme toggle for 404 page
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        themeToggle?.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
        
        // Initialize Lucide icons
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
