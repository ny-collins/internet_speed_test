<!DOCTYPE html>
<html>
<head>
    <title>Manual Speed Test</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #1a1a2e; color: #fff; }
        button { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; }
        #log { background: #000; color: #0f0; padding: 20px; font-family: monospace; white-space: pre-wrap; max-height: 500px; overflow-y: auto; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>🔧 SpeedCheck Manual Test</h1>
    <div>
        <button onclick="runFullTest()">▶️ Run Complete Speed Test</button>
        <button onclick="testLatency()">📡 Test Latency Only</button>
        <button onclick="testDownload()">⬇️ Test Download Only</button>
        <button onclick="testUpload()">⬆️ Test Upload Only</button>
        <button onclick="clearLog()">🗑️ Clear Log</button>
    </div>
    <div id="log"></div>

    <script>
        const API_BASE_URL = 'http://localhost:3000';
        
        const log = (msg, type = 'info') => {
            const timestamp = new Date().toLocaleTimeString();
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<span class="${type}">[${timestamp}] ${msg}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        };

        const clearLog = () => {
            document.getElementById('log').innerHTML = '';
            log('Log cleared', 'info');
        };

        async function testLatency() {
            log('🏓 Starting Latency Test...', 'info');
            const samples = [];
            
            try {
                for (let i = 0; i < 10; i++) {
                    const start = performance.now();
                    await fetch(`${API_BASE_URL}/api/ping?t=${Date.now()}`, { cache: 'no-store' });
                    const duration = performance.now() - start;
                    samples.push(duration);
                    log(`  Ping ${i+1}/10: ${duration.toFixed(2)}ms`);
                    await new Promise(r => setTimeout(r, 100));
                }
                
                const avg = samples.reduce((a, b) => a + b) / samples.length;
                const min = Math.min(...samples);
                const max = Math.max(...samples);
                
                log(`✅ Latency Test Complete:`, 'success');
                log(`   Average: ${avg.toFixed(2)}ms`, 'success');
                log(`   Min: ${min.toFixed(2)}ms, Max: ${max.toFixed(2)}ms`, 'success');
            } catch (error) {
                log(`❌ Latency test failed: ${error.message}`, 'error');
            }
        }

        async function testDownload() {
            log('⬇️ Starting Download Test (10 seconds)...', 'info');
            
            try {
                const url = `${API_BASE_URL}/api/download?size=50&chunk=512&t=${Date.now()}`;
                const startTime = performance.now();
                let totalBytes = 0;
                
                const response = await fetch(url, { cache: 'no-store' });
                const reader = response.body.getReader();
                
                const testDuration = 10000; // 10 seconds
                let lastLog = startTime;
                
                while (true) {
                    const elapsed = performance.now() - startTime;
                    if (elapsed >= testDuration) break;
                    
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    totalBytes += value.length;
                    
                    // Log every second
                    if (performance.now() - lastLog >= 1000) {
                        const currentSpeed = (totalBytes * 8) / (elapsed / 1000) / 1_000_000;
                        log(`  ${Math.floor(elapsed/1000)}s: ${currentSpeed.toFixed(2)} Mbps (${(totalBytes/1024/1024).toFixed(1)} MB)`, 'info');
                        lastLog = performance.now();
                    }
                }
                
                try { await reader.cancel(); } catch {}
                
                const finalDuration = (performance.now() - startTime) / 1000;
                const finalSpeed = (totalBytes * 8) / finalDuration / 1_000_000;
                
                log(`✅ Download Test Complete:`, 'success');
                log(`   Speed: ${finalSpeed.toFixed(2)} Mbps`, 'success');
                log(`   Data: ${(totalBytes/1024/1024).toFixed(2)} MB in ${finalDuration.toFixed(1)}s`, 'success');
            } catch (error) {
                log(`❌ Download test failed: ${error.message}`, 'error');
            }
        }

        async function testUpload() {
            log('⬆️ Starting Upload Test (10 seconds)...', 'info');
            
            try {
                const testDuration = 10000;
                const chunk = new Uint8Array(65536); // 64KB chunks
                crypto.getRandomValues(chunk);
                
                const startTime = performance.now();
                let totalBytes = 0;
                
                return new Promise((resolve) => {
                    const xhr = new XMLHttpRequest();
                    let lastLog = startTime;
                    
                    xhr.upload.onprogress = (event) => {
                        const elapsed = performance.now() - startTime;
                        if (elapsed >= testDuration) {
                            xhr.abort();
                            return;
                        }
                        
                        totalBytes = event.loaded;
                        
                        if (performance.now() - lastLog >= 1000) {
                            const currentSpeed = (totalBytes * 8) / (elapsed / 1000) / 1_000_000;
                            log(`  ${Math.floor(elapsed/1000)}s: ${currentSpeed.toFixed(2)} Mbps (${(totalBytes/1024/1024).toFixed(1)} MB)`, 'info');
                            lastLog = performance.now();
                        }
                    };
                    
                    xhr.onload = xhr.onerror = xhr.onabort = () => {
                        const finalDuration = (performance.now() - startTime) / 1000;
                        const finalSpeed = (totalBytes * 8) / finalDuration / 1_000_000;
                        
                        log(`✅ Upload Test Complete:`, 'success');
                        log(`   Speed: ${finalSpeed.toFixed(2)} Mbps`, 'success');
                        log(`   Data: ${(totalBytes/1024/1024).toFixed(2)} MB in ${finalDuration.toFixed(1)}s`, 'success');
                        resolve();
                    };
                    
                    // Create a large blob for 10 seconds of uploading
                    const chunks = [];
                    for (let i = 0; i < 1000; i++) { // ~64MB total
                        chunks.push(chunk.buffer);
                    }
                    const blob = new Blob(chunks);
                    
                    xhr.open('POST', `${API_BASE_URL}/api/upload?t=${Date.now()}`);
                    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                    xhr.send(blob);
                });
            } catch (error) {
                log(`❌ Upload test failed: ${error.message}`, 'error');
            }
        }

        async function runFullTest() {
            log('🚀 Starting Complete Speed Test...', 'info');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
            
            await testLatency();
            log('');
            await testDownload();
            log('');
            await testUpload();
            log('');
            log('🎉 All tests complete!', 'success');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        }

        log('Manual test page loaded. Ready to test!', 'info');
    </script>
</body>
</html>
