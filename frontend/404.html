<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>404 - Page Not Found | SpeedCheck</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/main.css?v=1.62.0">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page-404">
    
    <div style="position: absolute; top: 20px; right: 20px;">
        <button class="theme-toggle-inline" id="themeToggle" aria-label="Toggle theme">
            <i data-lucide="moon" class="theme-icon"></i>
        </button>
    </div>

    <div class="error-container" style="text-align: center; padding: 2rem; max-width: 600px;">
        <i data-lucide="ghost" class="error-icon"></i>
        
        <div class="error-code">404</div>
        
        <h1 style="margin-bottom: 1.5rem;">Page Not Found</h1>
        
        <p style="margin-bottom: 2rem; color: var(--color-text-secondary); font-size: 1.1rem;">
            Looks like your request got lost in the tubes. Even with the fastest internet, we can't find this page.
        </p>
        
        <div class="nav-buttons" style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn-primary">
                <i data-lucide="home"></i>
                Go Home
            </a>
            <a href="/learn.html" class="btn-secondary">
                <i data-lucide="book-open"></i>
                Learn Basics
            </a>
        </div>
    </div>

    <script type="module" src="/main.js?v=1.62.0"></script>
</body>
</html>
